name: build

# Stage 1, the PGO training and stage 2 run as separate jobs so that each
# stays well inside the 6 hour limit of GitHub-hosted runners (4 vCPUs). Pushing a tag v<llvm
# version>-<n> (e.g. v23.1.6-1) builds the Debian 10 package and publishes it
# as a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      distro:
        description: Debian release to build on (the result runs on it and on every newer release)
        type: choice
        options: [buster, bullseye, bookworm, trixie]
        default: buster
      arch:
        description: Architecture
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      targets:
        description: LLVM_TARGETS_TO_BUILD of the final compiler
        type: string
        default: all
      lto:
        description: LTO of the final compiler (OFF builds stage 2 about three times as fast)
        type: choice
        options: [Thin, OFF]
        default: Thin

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.distro }}-${{ inputs.arch }}
  cancel-in-progress: false

env:
  DISTRO: ${{ inputs.distro || 'buster' }}
  ARCH: ${{ inputs.arch || 'x86_64' }}
  TARGETS: ${{ inputs.targets || 'all' }}
  LTO: ${{ inputs.lto || 'Thin' }}

jobs:
  stage1:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: sources-${{ env.ARCH }}-${{ hashFiles('config/sources.lock') }}
      - run: ./build.sh fetch image stage1
      - name: Pack stage 1
        run: tar -C "build/$DISTRO-$ARCH" -cf - stage1-install | zstd -T0 -6 -o stage1.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage1-${{ env.DISTRO }}-${{ env.ARCH }}
          path: stage1.tar.zst
          compression-level: 0
          retention-days: 3

  pgo:
    needs: stage1
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: sources-${{ env.ARCH }}-${{ hashFiles('config/sources.lock') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage1-${{ env.DISTRO }}-${{ env.ARCH }}
      - name: Unpack stage 1
        run: |
          mkdir -p "build/$DISTRO-$ARCH"
          zstd -dc stage1.tar.zst | tar -C "build/$DISTRO-$ARCH" -xf -
          rm stage1.tar.zst
      - run: ./build.sh fetch image pgo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-${{ env.DISTRO }}-${{ env.ARCH }}
          path: |
            build/${{ env.DISTRO }}-${{ env.ARCH }}/clang.profdata
            build/${{ env.DISTRO }}-${{ env.ARCH }}/clang.profdata.source-id
          retention-days: 3

  stage2:
    needs: [stage1, pgo]
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources
          key: sources-${{ env.ARCH }}-${{ hashFiles('config/sources.lock') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage1-${{ env.DISTRO }}-${{ env.ARCH }}
      - name: Unpack stage 1
        run: |
          mkdir -p "build/$DISTRO-$ARCH"
          zstd -dc stage1.tar.zst | tar -C "build/$DISTRO-$ARCH" -xf -
          rm stage1.tar.zst
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-${{ env.DISTRO }}-${{ env.ARCH }}
          path: build/${{ env.DISTRO }}-${{ env.ARCH }}
      - run: ./build.sh fetch image stage2 package
      - run: df -h / && du -sh build/*/* || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ env.DISTRO }}-${{ env.ARCH }}
          path: out/
          compression-level: 0

  test:
    needs: stage2
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ env.DISTRO }}-${{ env.ARCH }}
          path: out/
      # The package must work on the distro it was built on and every newer one.
      - run: ./build.sh test
        env:
          TEST_DISTROS: compatible

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [stage2, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ env.DISTRO }}-${{ env.ARCH }}
          path: out/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source config/versions.env
          case "$GITHUB_REF_NAME" in
            "v$LLVM_VERSION"-*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match LLVM_VERSION=$LLVM_VERSION (expected v$LLVM_VERSION-<n>)"; exit 1 ;;
          esac
          {
            echo "LLVM $LLVM_VERSION (clang, lld, compiler-rt with sanitizers, libc++, libc++abi, libunwind) built on Debian 10 for Debian 10 and newer."
            echo
            echo '```'
            sed -n '1,/^Patch checksums:/p' out/*.BUILD-INFO.txt | sed '$d'
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "LLVM $LLVM_VERSION ($GITHUB_REF_NAME)" --notes-file notes.md
